<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('일정 관리 - TeamSchedule')}"></head>
<body>
<div class="app-container">
    <nav th:replace="~{fragments :: sidebar}"></nav>
    <div class="main-content">
        <header th:replace="~{fragments :: header('일정 관리')}"></header>
        <div class="content">

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

            <div class="page-header">
                <h1 class="page-title">전체 일정</h1>
                <a th:href="@{/schedule/new}" class="btn btn-primary">
                    <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    새 일정
                </a>
            </div>

            <!-- 뷰 탭 -->
            <div class="view-tabs">
                <button class="view-tab active" data-view="list">
                    <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px;"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    목록
                </button>
                <button class="view-tab" data-view="calendar">
                    <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    캘린더
                </button>
                <button class="view-tab" data-view="gantt">
                    <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px;"><rect x="3" y="3" width="18" height="4" rx="1"/><rect x="3" y="10" width="12" height="4" rx="1"/><rect x="3" y="17" width="15" height="4" rx="1"/></svg>
                    간트
                </button>
            </div>

            <!-- 목록 뷰 -->
            <div id="view-list">
                <form th:action="@{/schedule}" method="get" class="filter-bar">
                    <div class="form-group">
                        <label class="form-label">검색</label>
                        <input type="text" name="keyword" class="form-control" placeholder="일정명 또는 내용 검색..."
                               th:value="${keyword}">
                    </div>
                    <div class="form-group" style="min-width:150px; flex:0;">
                        <label class="form-label">상태</label>
                        <select name="completed" class="form-control">
                            <option value="">전체</option>
                            <option value="false" th:selected="${completed != null and !completed}">진행중</option>
                            <option value="true" th:selected="${completed != null and completed}">완료</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-secondary">검색</button>
                    <a th:href="@{/schedule}" class="btn btn-secondary">초기화</a>
                </form>

                <div th:if="${#lists.isEmpty(schedules)}" class="empty-state">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <h3>일정이 없습니다</h3>
                    <p>새 일정을 등록해보세요.</p>
                </div>

                <div class="schedule-grid" th:unless="${#lists.isEmpty(schedules)}">
                    <div th:each="schedule : ${schedules}"
                         class="schedule-card"
                         th:classappend="${schedule.completed ? 'completed' : ''}">
                        <div class="schedule-card-header">
                            <span class="schedule-card-title"
                                  th:classappend="${schedule.completed ? 'done' : ''}"
                                  th:text="${schedule.title}">일정명</span>
                            <span th:if="${schedule.completed}" class="badge badge-completed">완료</span>
                        </div>
                        <div class="schedule-card-content" th:if="${schedule.content}" th:text="${schedule.content}"></div>
                        <div class="schedule-card-meta">
                            <span class="meta-item" th:if="${schedule.scheduledAt}">
                                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                <span th:if="${schedule.startAt != null}"
                                      th:text="${#temporals.format(schedule.startAt, 'MM/dd')} + ' → ' + ${#temporals.format(schedule.scheduledAt, 'MM/dd HH:mm')}">기간</span>
                                <span th:unless="${schedule.startAt != null}"
                                      th:text="${#temporals.format(schedule.scheduledAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                            </span>
                            <span class="meta-item" th:if="${schedule.createdBy}">
                                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                <span th:text="${schedule.createdBy.name}">작성자</span>
                            </span>
                        </div>
                        <div class="schedule-tags" th:unless="${#lists.isEmpty(schedule.taggedMembers)}">
                            <span th:each="member : ${schedule.taggedMembers}" class="tag" th:text="${member.name}">태그</span>
                        </div>
                        <div class="schedule-card-actions">
                            <form th:action="@{'/schedule/' + ${schedule.id} + '/toggle'}" method="post">
                                <button type="submit" class="btn btn-sm btn-secondary"
                                        th:text="${schedule.completed ? '미완료로 변경' : '완료 처리'}">완료</button>
                            </form>
                            <a th:href="@{'/schedule/' + ${schedule.id} + '/edit'}" class="btn btn-sm btn-secondary">수정</a>
                            <form th:action="@{'/schedule/' + ${schedule.id} + '/delete'}" method="post">
                                <button type="submit" class="btn btn-sm btn-danger" data-confirm="정말 삭제하시겠습니까?">삭제</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 캘린더 뷰 -->
            <div id="view-calendar" style="display:none;"></div>

            <!-- 간트 뷰 -->
            <div id="view-gantt" style="display:none;"></div>

        </div>
        <footer th:replace="~{fragments :: footer}"></footer>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/schedule-views.js}"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        var data = /*[[${schedules}]]*/ [];
        var mapped = [];
        for (var i = 0; i < data.length; i++) {
            var s = data[i];
            mapped.push({
                id: s.id,
                title: s.title,
                content: s.content,
                startAt: s.startAt ? s.startAt.toString() : null,
                scheduledAt: s.scheduledAt ? s.scheduledAt.toString() : null,
                completed: s.completed,
                createdBy: s.createdBy ? s.createdBy.name : null,
                createdAt: s.createdAt ? s.createdAt.toString() : null
            });
        }
        ScheduleViews.init(mapped);
    });
</script>
</body>
</html>
