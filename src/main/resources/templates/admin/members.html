<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('멤버 관리 - TeamSchedule')}"></head>
<body>
<div class="app-container">
    <nav th:replace="~{fragments :: sidebar}"></nav>
    <div class="main-content">
        <header th:replace="~{fragments :: header('멤버 관리')}"></header>
        <div class="content">

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

            <!-- 가입 승인 대기 (E1-1) -->
            <div class="card mb-3">
                <div class="card-header">
                    <h3 class="card-title">가입 승인 대기</h3>
                    <span class="badge badge-pending" th:text="${pendingMembers.size()} + '명'">0명</span>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(pendingMembers)}" class="text-muted" style="padding:20px 0; text-align:center;">
                        대기 중인 가입 신청이 없습니다.
                    </div>
                    <div class="table-wrapper" th:unless="${#lists.isEmpty(pendingMembers)}">
                        <table>
                            <thead>
                                <tr>
                                    <th>아이디</th>
                                    <th>이름</th>
                                    <th>이메일</th>
                                    <th>신청일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="member : ${pendingMembers}">
                                    <td th:text="${member.loginId}">id</td>
                                    <td th:text="${member.name}">이름</td>
                                    <td th:text="${member.email}">이메일</td>
                                    <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd')}">날짜</td>
                                    <td>
                                        <div class="d-flex gap-2">
                                            <form th:action="@{'/admin/members/' + ${member.id} + '/approve'}" method="post">
                                                <button type="submit" class="btn btn-sm btn-primary">승인</button>
                                            </form>
                                            <form th:action="@{'/admin/members/' + ${member.id} + '/reject'}" method="post">
                                                <button type="submit" class="btn btn-sm btn-danger">거절</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 승인된 멤버 목록 (E1-2) -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">멤버 목록</h3>
                    <span class="badge badge-approved" th:text="${approvedMembers.size()} + '명'">0명</span>
                </div>
                <div class="card-body">
                    <div class="table-wrapper" th:unless="${#lists.isEmpty(approvedMembers)}">
                        <table>
                            <thead>
                                <tr>
                                    <th>아이디</th>
                                    <th>이름</th>
                                    <th>이메일</th>
                                    <th>역할</th>
                                    <th>가입일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="member : ${approvedMembers}">
                                    <td th:text="${member.loginId}">id</td>
                                    <td th:text="${member.name}">이름</td>
                                    <td th:text="${member.email}">이메일</td>
                                    <td>
                                        <span class="badge" th:classappend="${member.role.name() == 'ADMIN' ? 'badge-completed' : 'badge-approved'}"
                                              th:text="${member.role.name() == 'ADMIN' ? '관리자' : '멤버'}">역할</span>
                                    </td>
                                    <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd')}">날짜</td>
                                    <td>
                                        <form th:if="${member.role.name() != 'ADMIN'}"
                                              th:action="@{'/admin/members/' + ${member.id} + '/kick'}" method="post">
                                            <button type="submit" class="btn btn-sm btn-danger"
                                                    data-confirm="정말 이 멤버를 추방하시겠습니까?">추방</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
        <footer th:replace="~{fragments :: footer}"></footer>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
