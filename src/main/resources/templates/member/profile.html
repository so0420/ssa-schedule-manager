<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('내 프로필 - TeamSchedule')}"></head>
<body>
<div class="app-container">
    <nav th:replace="~{fragments :: sidebar}"></nav>
    <div class="main-content">
        <header th:replace="~{fragments :: header('내 프로필')}"></header>
        <div class="content">

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <div class="profile-layout">

                <!-- 프로필 카드 (좌측) -->
                <aside class="profile-aside">
                    <div class="card">
                        <div class="card-body" style="text-align:center; padding:32px 24px;">
                            <div class="profile-avatar" th:text="${#strings.substring(member.name, 0, 1)}">U</div>
                            <h3 class="profile-name" th:text="${member.name}">사용자</h3>
                            <span class="badge badge-approved" th:text="${member.role.name() == 'ADMIN' ? '관리자' : '멤버'}">멤버</span>
                            <div class="profile-meta">
                                <div class="profile-meta-item">
                                    <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px;display:inline-block;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                    <span th:text="${member.loginId}">admin</span>
                                </div>
                                <div class="profile-meta-item">
                                    <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px;display:inline-block;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                    <span th:text="${member.email}">email</span>
                                </div>
                                <div class="profile-meta-item">
                                    <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px;display:inline-block;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                    <span th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd')}" style="margin-right:4px;">날짜</span> 가입
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- 설정 영역 (우측) -->
                <div class="profile-main">

                    <!-- 사용자명 변경 -->
                    <div class="card mb-3">
                        <div class="card-header">사용자명 변경</div>
                        <div class="card-body">
                            <form th:action="@{/member/update-name}" method="post" class="profile-form-row">
                                <div class="profile-form-field">
                                    <input type="text" name="name" class="form-control"
                                           th:value="${member.name}" required placeholder="새 사용자명">
                                </div>
                                <button type="submit" class="btn btn-primary">변경</button>
                            </form>
                        </div>
                    </div>

                    <!-- 비밀번호 변경 -->
                    <div class="card mb-3">
                        <div class="card-header">비밀번호 변경</div>
                        <div class="card-body">
                            <form th:action="@{/member/update-password}" method="post">
                                <div class="profile-form-grid">
                                    <div class="form-group" style="margin-bottom:0;">
                                        <label class="form-label">현재 비밀번호</label>
                                        <input type="password" name="currentPassword" class="form-control" required>
                                    </div>
                                    <div class="form-group" style="margin-bottom:0;">
                                        <label class="form-label">새 비밀번호</label>
                                        <input type="password" name="newPassword" class="form-control" required>
                                    </div>
                                </div>
                                <div style="margin-top:16px;">
                                    <button type="submit" class="btn btn-primary">변경</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- 알림 설정 -->
                    <div class="card mb-3">
                        <div class="card-header">알림 설정</div>
                        <div class="card-body">
                            <form th:action="@{/member/update-notification}" method="post">
                                <div class="profile-toggle-row">
                                    <div>
                                        <div style="font-size:14px; font-weight:700; color:var(--db-text-strong);">알림 수신</div>
                                        <div style="font-size:12px; color:var(--db-text-mute); margin-top:2px;">일정 태그 및 마감 알림을 받습니다.</div>
                                    </div>
                                    <label class="toggle">
                                        <input type="checkbox" name="notificationEnabled" value="true"
                                               th:checked="${member.notificationEnabled}">
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                                <div class="form-group" style="margin-top:16px; margin-bottom:0;">
                                    <label class="form-label">Webhook URL</label>
                                    <input type="url" name="webhookUrl" class="form-control"
                                           th:value="${member.webhookUrl}"
                                           placeholder="https://hooks.slack.com/...">
                                    <span class="form-hint">Slack, Discord 등 외부 서비스 Webhook URL</span>
                                </div>
                                <div style="margin-top:16px;">
                                    <button type="submit" class="btn btn-primary">저장</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- 위험 영역 -->
                    <div class="card profile-danger-card">
                        <div class="card-header" style="color:var(--btn-danger);">위험 영역</div>
                        <div class="card-body">
                            <div class="profile-toggle-row">
                                <div>
                                    <div style="font-size:14px; font-weight:700; color:var(--db-text-strong);">회원 탈퇴</div>
                                    <div style="font-size:12px; color:var(--db-text-mute); margin-top:2px;">모든 데이터가 삭제되며 복구할 수 없습니다.</div>
                                </div>
                                <form th:action="@{/member/delete}" method="post">
                                    <button type="submit" class="btn btn-danger btn-sm"
                                            data-confirm="정말 탈퇴하시겠습니까? 이 작업은 되돌릴 수 없습니다.">탈퇴</button>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
        <footer th:replace="~{fragments :: footer}"></footer>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
