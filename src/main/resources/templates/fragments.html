<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Head Fragment -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">팀 일정 관리</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<!-- Sidebar Fragment -->
<nav th:fragment="sidebar" class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <span class="sidebar-brand">TeamSchedule</span>
    </div>
    <div class="sidebar-nav">
        <div class="nav-section">
            <div class="nav-section-title">메뉴</div>
            <a href="/" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                대시보드
            </a>
            <a href="/schedule" class="nav-link">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                일정 관리
            </a>
            <a href="/member/profile" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                내 프로필
            </a>
        </div>
        <div class="nav-section" th:if="${session.loginMember != null and session.loginMember.role.name() == 'ADMIN'}">
            <div class="nav-section-title">관리자</div>
            <a href="/admin/members" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                멤버 관리
            </a>
            <a href="/admin/logs" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                활동 로그
            </a>
        </div>
    </div>
    <div class="sidebar-footer">
        <a href="/auth/logout">로그아웃</a>
    </div>
</nav>

<!-- Header Fragment -->
<header th:fragment="header(pageTitle)" class="header">
    <h2 class="header-title" th:text="${pageTitle}">페이지 제목</h2>
    <div class="header-user" th:if="${session.loginMember != null}">
        <div class="header-user-info">
            <div class="header-user-name" th:text="${session.loginMember.name}">사용자</div>
            <div class="header-user-role" th:text="${session.loginMember.role.name() == 'ADMIN' ? '관리자' : '멤버'}">역할</div>
        </div>
        <div class="avatar" th:text="${#strings.substring(session.loginMember.name, 0, 1)}">U</div>
    </div>
</header>

<!-- Footer Fragment -->
<footer th:fragment="footer" class="footer">
    <span>Team Schedule &copy; 2024</span>
    <div>
        <a href="/service/terms">이용약관</a>
        <a href="/service/privacy">개인정보처리방침</a>
    </div>
</footer>

</html>
