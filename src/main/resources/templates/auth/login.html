<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('로그인 - TeamSchedule')}"></head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>TeamSchedule</h1>
            <p>팀 프로젝트 일정 관리 시스템</p>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form action="/auth/login" method="post">
            <div class="form-group">
                <label class="form-label">아이디</label>
                <input type="text" name="loginId" class="form-control" placeholder="아이디를 입력하세요" required>
            </div>
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">로그인</button>
        </form>

        <div class="auth-links">
            <a href="/auth/signup">회원가입</a>
            <a href="/auth/find-id">ID 찾기</a>
            <a href="/auth/find-password">비밀번호 찾기</a>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
