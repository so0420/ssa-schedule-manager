<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('회원가입 - TeamSchedule')}"></head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>회원가입</h1>
            <p>새 계정을 만들어 팀에 참여하세요</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form action="/auth/signup" method="post">
            <div class="form-group">
                <label class="form-label">아이디</label>
                <input type="text" name="loginId" class="form-control" placeholder="아이디" required>
            </div>
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" name="password" class="form-control" placeholder="비밀번호" required>
            </div>
            <div class="form-group">
                <label class="form-label">이름</label>
                <input type="text" name="name" class="form-control" placeholder="이름" required>
            </div>
            <div class="form-group">
                <label class="form-label">이메일</label>
                <input type="email" name="email" class="form-control" placeholder="이메일" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">가입 신청</button>
        </form>

        <div class="auth-links">
            <a href="/auth/login">로그인으로 돌아가기</a>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
