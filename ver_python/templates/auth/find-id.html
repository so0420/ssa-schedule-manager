<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID 찾기 - TeamSchedule</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>ID 찾기</h1>
            <p>이름과 이메일로 아이디를 찾습니다</p>
        </div>

        {% if result %}
        <div class="alert alert-success">{{ result }}</div>
        {% endif %}
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/auth/find-id" method="post">
            <div class="form-group">
                <label class="form-label">이름</label>
                <input type="text" name="name" class="form-control" placeholder="가입 시 입력한 이름" required>
            </div>
            <div class="form-group">
                <label class="form-label">이메일</label>
                <input type="email" name="email" class="form-control" placeholder="가입 시 입력한 이메일" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">ID 찾기</button>
        </form>

        <div class="auth-links">
            <a href="/auth/login">로그인으로 돌아가기</a>
            <a href="/auth/find-password">비밀번호 찾기</a>
        </div>
    </div>
</div>
<script src="/static/js/app.js"></script>
</body>
</html>
