<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('활동 로그 - TeamSchedule')}"></head>
<body>
<div class="app-container">
    <nav th:replace="~{fragments :: sidebar}"></nav>
    <div class="main-content">
        <header th:replace="~{fragments :: header('활동 로그')}"></header>
        <div class="content">

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">전체 활동 로그</h3>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(logs)}" class="empty-state">
                        <h3>기록된 활동이 없습니다</h3>
                    </div>
                    <div class="table-wrapper" th:unless="${#lists.isEmpty(logs)}">
                        <table>
                            <thead>
                                <tr>
                                    <th>시간</th>
                                    <th>행위자</th>
                                    <th>활동 내용</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="log : ${logs}">
                                    <td th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm:ss')}">시간</td>
                                    <td th:text="${log.actor}">행위자</td>
                                    <td th:text="${log.action}">활동</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
        <footer th:replace="~{fragments :: footer}"></footer>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
